name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs,examples]"

      - name: Validate source metadata
        run: |
          python scripts/release_check.py

      - name: Compile package and examples
        run: |
          python -m compileall -q robustcov examples benchmarks docs scripts

      - name: Validate committed external snapshots
        run: |
          python scripts/publish_external_snapshot.py check

      - name: Build Sphinx docs
        run: |
          python -m sphinx -W --keep-going -b html docs docs/_build/html
