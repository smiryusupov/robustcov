name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Validate source metadata
        run: |
          python scripts/release_check.py

      - name: Run fast cross-platform suites
        run: |
          python -m pytest -q -m "unit or integration or native"

  minimum-dependencies:
    name: Minimum dependencies on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"
      PIP_ONLY_BINARY: ":all:"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install minimum supported dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "scikit-build-core>=0.11.3" \
            "pybind11>=3.0.1" \
            "pytest>=8"
          python -m pip install -r requirements/minimum.txt
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Show resolved versions
        run: |
          python -c "import sys, numpy, scipy, sklearn; print(sys.version); print('numpy=', numpy.__version__); print('scipy=', scipy.__version__); print('sklearn=', sklearn.__version__)"

      - name: Run fast suites without plotting dependency
        run: |
          python -m pytest -q -m "unit or integration or native"


  release-test-groups:
    name: ${{ matrix.group }} suite on Python 3.13
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        group: [statistical, benchmark, packaging]

    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run grouped release suite
        run: |
          python -m pytest -q -m "${{ matrix.group }}" --durations=20
