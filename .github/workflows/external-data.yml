name: External C-MAPSS validation

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: C-MAPSS subset to run
        required: true
        default: cmapss_fd002
        type: choice
        options:
          - cmapss_fd002
          - cmapss_fd004
          - all

permissions:
  contents: read

jobs:
  external-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Configure external data directory
        shell: bash
        run: echo "ROBUSTCOV_DATA_DIR=$RUNNER_TEMP/robustcov-data" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and example dependencies
        run: python -m pip install -e ".[examples]"
      - name: Run C-MAPSS FD002 DRO-PCA workflow
        if: ${{ inputs.dataset == 'cmapss_fd002' || inputs.dataset == 'all' }}
        run: |
          python examples_external/cmapss_dro_pca_monitoring.py \
            --download \
            --subset FD002 \
            --outdir results/external/cmapss_fd002
      - name: Run C-MAPSS FD004 DRO-PCA workflow
        if: ${{ inputs.dataset == 'cmapss_fd004' || inputs.dataset == 'all' }}
        run: |
          python examples_external/cmapss_dro_pca_monitoring.py \
            --download \
            --subset FD004 \
            --outdir results/external/cmapss_fd004
      - name: Upload result summaries and plots only
        uses: actions/upload-artifact@v4
        with:
          name: robustcov-external-${{ inputs.dataset }}
          path: results/external
          if-no-files-found: error
          retention-days: 14
