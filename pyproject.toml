[build-system]
requires = [
  "scikit-build-core>=1.0.3",
  "pybind11>=3.0.1",
  "numpy>=2.0.0; python_version < '3.13'",
  "numpy>=2.1.0; python_version >= '3.13' and python_version < '3.14'",
  "numpy>=2.3.4; python_version >= '3.14'",
]
build-backend = "scikit_build_core.build"

[project]
name = "robustcov"
version = "0.1.0a2"
description = "Robust covariance, anomaly scoring, PCA, and monitoring for contaminated and heavy-tailed data."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

authors = [
  { name = "Shohruh Miryusupov", email = "shohruh@miryusupov.com" },
]

maintainers = [
  { name = "Shohruh Miryusupov", email = "shohruh@miryusupov.com" },
]

dependencies = [
  "numpy>=2.0.0; python_version < '3.13'",
  "numpy>=2.1.0; python_version >= '3.13' and python_version < '3.14'",
  "numpy>=2.3.4; python_version >= '3.14'",
  "scipy>=1.13.0; python_version < '3.13'",
  "scipy>=1.14.1; python_version >= '3.13' and python_version < '3.14'",
  "scipy>=1.16.1; python_version >= '3.14'",
]

keywords = [
  "robust covariance",
  "robust statistics",
  "scatter estimation",
  "anomaly detection",
  "outlier detection",
  "heavy tails",
  "Tyler estimator",
  "Mahalanobis distance",
  "SPD geometry",
  "kernel methods",
  "drift monitoring",
  "online subspace tracking",
  "online robust PCA",
  "robust PCA",
  "distributionally robust PCA",
  "Wasserstein DRO",
  "independent component analysis",
  "SOBI",
  "blind source separation",
  "robust factor model",
  "density power divergence",
  "cellwise covariance",
  "cellwise robust PCA",
  "sparse robust PCA",
  "kernel MRCD",
  "S-estimator",
  "MM-estimator",
  "nonlinear outlier detection",
  "graphical lasso",
  "sparse precision matrix",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/smiryusupov/robustcov"
Repository = "https://github.com/smiryusupov/robustcov"
Documentation = "https://robustcov.readthedocs.io/"
Issues = "https://github.com/smiryusupov/robustcov/issues"
Changelog = "https://github.com/smiryusupov/robustcov/blob/main/CHANGELOG.md"

[project.optional-dependencies]
plot = [
  "matplotlib>=3.10.5",
]

sklearn = [
  "scikit-learn>=1.5.0; python_version < '3.13'",
  "scikit-learn>=1.6.0; python_version >= '3.13' and python_version < '3.14'",
  "scikit-learn>=1.8.0; python_version >= '3.14'",
]

gpytorch = [
  "torch>=2.0",
  "gpytorch>=1.11",
]

test = [
  "pytest>=8",
  "matplotlib>=3.10.5",
  "scikit-learn>=1.5.0; python_version < '3.13'",
  "scikit-learn>=1.6.0; python_version >= '3.13' and python_version < '3.14'",
  "scikit-learn>=1.8.0; python_version >= '3.14'",
]

dev = [
  "pytest>=8",
  "matplotlib>=3.10.5",
  "scikit-learn>=1.5.0; python_version < '3.13'",
  "scikit-learn>=1.6.0; python_version >= '3.13' and python_version < '3.14'",
  "scikit-learn>=1.8.0; python_version >= '3.14'",
  "sphinx>=8",
  "furo>=2025.1",
  "build>=1.2",
  "twine>=6",
  "cibuildwheel>=3.1.4",
]

bench = [
  "scikit-learn>=1.5.0; python_version < '3.13'",
  "scikit-learn>=1.6.0; python_version >= '3.13' and python_version < '3.14'",
  "scikit-learn>=1.8.0; python_version >= '3.14'",
  "pandas>=2.2",
  "matplotlib>=3.10.5",
]

docs = [
  "sphinx>=8",
  "matplotlib>=3.10.5",
  "furo>=2025.1",
  "myst-parser>=4",
]

examples = [
  "scikit-learn>=1.5.0; python_version < '3.13'",
  "scikit-learn>=1.6.0; python_version >= '3.13' and python_version < '3.14'",
  "scikit-learn>=1.8.0; python_version >= '3.14'",
  "pandas>=2.2",
  "matplotlib>=3.10.5",
]

all = [
  "robustcov[dev,bench,docs,examples,plot,sklearn,gpytorch]",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["robustcov"]
cmake.version = ">=3.18"

[tool.scikit-build.sdist]
inclusion-mode = "explicit"
include = [
  "pyproject.toml",
  "CMakeLists.txt",
  "src/**",
  "robustcov/**",
  "tests/**",
  "examples/**",
  "examples_external/**",
  "benchmarks/**",
  "scripts/**",
  "requirements/**",
  "docs/**",
  "notebooks/**",
  "conda/**",
  ".github/workflows/**",
  ".readthedocs.yaml",
  "CHANGELOG.md",
  "CITATION.cff",
  "CONTRIBUTING.md",
  "LICENSE",
  "NOTICE",
  "README.md",
  "RELEASE.md",
]
exclude = [
  "**/__pycache__/**",
  "**/*.py[cod]",
  "**/*.so",
  "**/*.pyd",
  "docs/_build",
  "docs/_build/**",
  "results",
  "results/**",
  "build",
  "build/**",
  "dist",
  "dist/**",
  ".pytest_cache",
  ".pytest_cache/**",
  ".venv",
  ".venv/**",
  ".external-data",
  ".external-data/**",
  "data",
  "data/**",
  "examples_external/data",
  "examples_external/data/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore:.*covariance matrix associated to your dataset is not full rank.*:UserWarning",
  "ignore:.*Determinant has increased.*:RuntimeWarning",
]
markers = [
  "unit: fast focused estimator and numerical unit tests",
  "integration: cross-module, documentation, external-data, and interoperability tests",
  "statistical: repeated statistical validation and hardening tests",
  "benchmark: benchmark-script contracts and deterministic benchmark validations",
  "native: compiled-extension and OpenMP integration tests",
  "packaging: release metadata, isolated import, and distribution-readiness tests",
  "slow: tests intentionally excluded from the fast pull-request gate",
]

[tool.cibuildwheel]
build = "cp312-* cp313-* cp314-*"
skip = "*-musllinux_* pp* *-win32 *-manylinux_i686"
test-command = "python \"{project}/scripts/installed_package_smoke.py\" --expect-native yes --forbid-root \"{project}\" && python -m compileall -q \"{project}/examples\""
environment = "OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 OMP_NUM_THREADS=2"

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
